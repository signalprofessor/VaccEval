name: Validate external data

on:
  push:
    branches:
      - main
    paths:
      - config/external_sources.json
      - scripts/validate_external_sources.py
      - scripts/fetch_fhm_vaccination.py
      - .github/workflows/validate-external-data.yml
  schedule:
    - cron: "17 0 * * *"
      timezone: Europe/Stockholm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacceval-external-data-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Download and validate all sources
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out VaccEval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate registered external sources
        shell: bash
        run: |
          set +e
          python3 scripts/validate_external_sources.py
          status=$?
          cat output/external-data-validation.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Refresh compact public datasets
        run: |
          python3 scripts/fetch_wastewater.py public/data/wastewater.json
          python3 scripts/fetch_scb_mortality.py public/data/mortality.json
          python3 scripts/fetch_fhm_vaccination.py public/data/vaccination.json

      - name: Commit source updates
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "No published data changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wastewater.json public/data/mortality.json public/data/vaccination.json
          git commit -m "Update external surveillance data"
          git push
