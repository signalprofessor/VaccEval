name: Deploy VaccEval to Loopia

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Validate external data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vacceval-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out VaccEval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build:loopia

      - name: Run privacy check and package verification
        run: pnpm run package:loopia

      - name: Deploy to Loopia over encrypted FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ftpcluster.loopia.se
          username: ${{ secrets.LOOPIA_FTP_USERNAME }}
          password: ${{ secrets.LOOPIA_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./loopia-dist/
          server-dir: ./
          security: strict
          # Loopia manages authentication on the server. Never upload or delete
          # these files, including files tracked by an earlier deployment.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/.htpasswd*
            **/.htgroup*
            **/data/regional-covid.json
          log-level: minimal
          timeout: 120000

      - name: Verify anonymous access is blocked
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://vacceval.se/ \
            https://vacceval.se/data/cases.json \
            https://vacceval.se/data/regional-covid.json \
            https://www.vacceval.se/ \
            https://www.vacceval.se/data/cases.json; do
            status=$(curl --silent --show-error --location \
              --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
            if [ "$status" != "401" ]; then
              echo "::error::Authentication check failed: $url returned HTTP $status (expected 401)"
              exit 1
            fi
            echo "Authentication required: $url"
          done
