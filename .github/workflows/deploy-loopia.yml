name: Deploy VaccEval to Loopia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vacceval-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out VaccEval
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build:loopia

      - name: Run privacy check and package verification
        run: pnpm run package:loopia

      - name: Deploy to Loopia over encrypted FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ftpcluster.loopia.se
          username: ${{ secrets.LOOPIA_FTP_USERNAME }}
          password: ${{ secrets.LOOPIA_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./loopia-dist/
          server-dir: ./
          security: strict
          log-level: minimal
          timeout: 120000
